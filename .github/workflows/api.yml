name: api

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: api
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: gh-pages
      
      - name: Set up
        run: sudo apt install jq curl coreutils -y

      - name: Randomly select TK and SK
        id: select_keys
        run: |
          TK_ARR=("${{ secrets.TK1 }}" "${{ secrets.TK2 }}" "${{ secrets.TK3 }}" "${{ secrets.TK4 }}" "${{ secrets.TK5 }}")
          SK_ARR=("${{ secrets.SK1 }}" "${{ secrets.SK2 }}" "${{ secrets.SK3 }}" "${{ secrets.SK4 }}" "${{ secrets.SK5 }}")
          ARRAY_LENGTH=${#TK_ARR[@]}
          RANDOM_INDEX=$(( RANDOM % ARRAY_LENGTH ))
          SELECTED_TK=${TK_ARR[$RANDOM_INDEX]}
          SELECTED_SK=${SK_ARR[$RANDOM_INDEX]}
          
          # Base64 encode the selected token and secret
          ENCODED_TK=$(echo -n "${SELECTED_TK}" | base64)
          ENCODED_SK=$(echo -n "${SELECTED_SK}" | base64)
          
          echo "SELECTED_TK=${SELECTED_TK}" >> $GITHUB_ENV
          echo "SELECTED_SK=${SELECTED_SK}" >> $GITHUB_ENV
          echo "ENCODED_TK=${ENCODED_TK}" >> $GITHUB_ENV
          echo "ENCODED_SK=${ENCODED_SK}" >> $GITHUB_ENV
          
          echo "Selected key pair index: $RANDOM_INDEX"
          echo "Original TK length: ${#SELECTED_TK}"
          echo "Encoded TK: ${ENCODED_TK}"
          echo "Original SK length: ${#SELECTED_SK}"
          echo "Encoded SK: ${ENCODED_SK}"

      - name: Query api
        timeout-minutes: 4
        run: |
          sudo chmod 777 api.sh.x 
          # Pass both original and encoded values to the script
          ./api.sh.x 100 4 "${{ env.SELECTED_TK }}" "${{ env.SELECTED_SK }}" "${{ env.ENCODED_TK }}" "${{ env.ENCODED_SK }}"

      - name: Publish
        uses: peaceiris/actions-gh-pages@v3
        with:
          publish_dir: ./
          github_token: ${{ secrets.DEPLOY_SECRET }}
          user_name: ${{ secrets.MY_USER_NAME }}
          user_email: ${{ secrets.MY_USER_EMAIL }}
          commit_message: Auto update